# KS Adapter configuration. Values may reference environment variables:
#   ${NAME}            -> required environment variable
#   ${NAME:-default}   -> environment variable with fallback
# The same settings can be overridden with KS_* variables (see docs/CONFIGURATION.md).

server:
  host: 127.0.0.1
  port: ${KS_SERVER_PORT:-8000}
  log_level: ${KS_LOG_LEVEL:-info}
  reload: false

database:
  # Set the absolute database path as seen by the Firebird server.
  # Changing this path selects another file; the firebird account needs access.
  path: ${KS_DB_PATH:-/home/igor/Work/BAZAMS.FDB}
  host: ${KS_DB_HOST:-127.0.0.1}
  port: ${KS_DB_PORT:-3050}
  user: ${KS_DB_USER:-SYSDBA}
  password: ${KS_DB_PASSWORD:-masterkey}
  # Connection charset. WIN1250 matches the Polish data in BAZAMS.FDB.
  charset: ${KS_DB_CHARSET:-WIN1250}
  # Leave empty for native client discovery on Linux or Windows. Override only
  # for a nonstandard install, using a path on the adapter machine, not the DB server.
  client_library: ${KS_FB_CLIENT:-}
  pool_size: 5
  acquire_timeout: 10
  health_check: true
  # Fail fast at startup when the database file does not exist. Relative paths are
  # resolved against the project root first, so this also validates them.
  check_path: true

api:
  prefix: /api/v1
  default_limit: 50
  max_limit: 1000
  max_query_rows: 5000
  schema_cache_ttl: 300
  # Encoding used to decode BLOB values that are not text (e.g. WIN1250 data).
  blob_encoding: cp1250
  # Return NUMERIC/DECIMAL values as JSON strings to preserve precision.
  decimal_as_string: false
  # When set, every API request must send this value in the X-API-Key header.
  api_key: ${KS_API_KEY:-}
  # Allow curated inserts/updates and client deletions. Off means every
  # route is read-only and writes answer 403; keep false unless the adapter is
  # meant to create records in the live database.
  allow_writes: ${KS_ALLOW_WRITES:-true}
  # CORS origins allowed to call the API from a browser (empty = disabled).
  cors_origins: []
